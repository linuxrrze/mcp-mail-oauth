# Dovecot 2.4: same policy as ../2.3/, in 2.4 syntax (settings are prefixed
# oauth2_* or grouped in an oauth2 { } block).
# Tested with Dovecot 2.4.1 in the test stack (test-stack/, docs/mail-server.md).
# Check `doveconf -n` after including this file.
# Include from dovecot.conf:   !include oauth2.conf
#
# Keep your existing userdb: it must resolve the login name (the token's
# `email` claim) to a mailbox.

auth_mechanisms {
  xoauth2 = yes
  oauthbearer = yes
}

oauth2 {
  introspection_mode = post
  introspection_url = https://dovecot:CHANGE_ME_DOVECOT_SECRET@sso.example.com/realms/mail/protocol/openid-connect/token/introspect
  # Required for active_attribute to be evaluated (2.4 docs).
  force_introspection = yes
  active_attribute = active
  active_value = true
  username_attribute = email
  scope = mail
}

passdb oauth2 {
  mechanisms_filter = xoauth2 oauthbearer
}
