# mcp-mail-oauth against your existing Keycloak, Dovecot/Postfix and Open WebUI.
#
#   cp .env.example .env   # then edit
#   docker compose up -d
#
# Put a TLS-terminating reverse proxy in front and use its public URL as
# BASE_URL. In the default AUTH_MODE=resource nothing ever redirects a
# browser here, so the URL only needs to be reachable by Open WebUI's backend.

name: mcp-mail-oauth

services:
  mcp-mail:
    build: .
    image: mcp-mail-oauth
    container_name: mcp-mail
    env_file: .env
    volumes:
      # Only used in AUTH_MODE=proxy; harmless otherwise.
      - mcp-mail-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    # /healthz needs no token and touches neither Keycloak nor the mail
    # server: it says the process serves HTTP. Overrides the image's check so
    # a changed PORT is honoured. The image has no curl; Python it has.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('PORT', '8000'), timeout=4).status != 200)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mcp-mail-data:
