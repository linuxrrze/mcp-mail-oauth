# Dovecot 2.3 for the test stack: IMAP (implicit TLS on 993) and LMTP for
# Postfix. Authentication comes entirely from the deploy/ files included below.
protocols = imap lmtp
listen = *
log_path = /dev/stderr
auth_verbose = yes

ssl = required
ssl_cert = </certs/mail.crt
ssl_key = </certs/mail.key
ssl_dh = </usr/share/dovecot/dh.pem

mail_location = maildir:~/Maildir
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  # German names on purpose: the server must find these by special-use
  # flag, not by name (save_draft, trash_messages).
  mailbox Entwürfe {
    special_use = \Drafts
    auto = create
  }
  mailbox Papierkorb {
    special_use = \Trash
    auto = create
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}

# Mailboxes for any login name (= the token's email claim). allow_all_users:
# LMTP looks users up in the userdb only, and the oauth2 passdb can't answer
# user lookups.
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%u allow_all_users=yes
}

service imap-login {
  inet_listener imap {
    port = 0
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

# Mechanisms are added to this list by auth-oauth2.conf.ext.
auth_mechanisms = plain
!include conf.d/auth-oauth2.conf.ext
!include auth-socket-for-postfix.conf
