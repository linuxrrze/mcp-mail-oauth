# Dovecot 2.4 for the test stack: IMAP (implicit TLS on 993) and LMTP for
# Postfix. Authentication comes entirely from the deploy/ files included below.
dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.1

protocols = imap lmtp
listen = *
log_path = /dev/stderr
auth_verbose = yes

ssl = required
ssl_server_cert_file = /certs/mail.crt
ssl_server_key_file = /certs/mail.key

mail_driver = maildir
mail_path = ~/Maildir
mail_home = /var/mail/%{user}
mail_uid = vmail
mail_gid = vmail

namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
}

# Mailboxes for any login name (= the token's email claim). allow_all_users:
# LMTP looks users up in the userdb only, and the oauth2 settings can't
# answer user lookups.
userdb static {
  allow_all_users = yes
}

service imap-login {
  inet_listener imap {
    port = 0
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

!include oauth2.conf
!include auth-socket-for-postfix.conf
